name: Post-CI tests
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: self-hosted
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3f1c0a9e7b2d4c6f8a1e5b9d0c7f2a4e6b8d1c3f
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: make e2e
