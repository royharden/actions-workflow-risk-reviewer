name: Run tests on comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  test-member:
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
      - run: ./scripts/ci.sh
  test-anyone:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/retest')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
      - run: ./scripts/ci.sh
      - name: Thank maintainers
        if: github.event.comment.author_association == 'MEMBER'
        run: echo "Thanks for triggering the retest"
