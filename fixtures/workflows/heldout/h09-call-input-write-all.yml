name: Reusable release notes
on:
  workflow_call:
    inputs:
      version:
        description: Version being released
        required: true
        type: string
permissions:
  contents: read
jobs:
  notes:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@3f1c0a9e7b2d4c6f8a1e5b9d0c7f2a4e6b8d1c3f
      - name: Write notes
        run: |
          echo "Release ${{ inputs.version }}" > NOTES.md
          git log --oneline -20 >> NOTES.md
