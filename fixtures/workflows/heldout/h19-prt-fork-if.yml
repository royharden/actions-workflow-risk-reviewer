name: Same-repo PR bundle size
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  size:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3f1c0a9e7b2d4c6f8a1e5b9d0c7f2a4e6b8d1c3f
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: npm ci
      - run: npm run size
