name: Publish docs
on:
  push:
    branches: [main]
permissions:
  contents: read
env:
  DOCS_REGION: eu-west-1
  DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@3f1c0a9e7b2d4c6f8a1e5b9d0c7f2a4e6b8d1c3f
      - name: Build site
        env:
          ANALYTICS_KEY: ${{ secrets.ANALYTICS_KEY }}
        run: make docs
      - name: Debug token
        run: echo "token=${{ secrets.FAKE_TOKEN_DO_NOT_USE }}" > /dev/null
