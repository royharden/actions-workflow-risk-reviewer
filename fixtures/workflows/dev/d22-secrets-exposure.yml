name: Package

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_ENV: production
  REGISTRY_TOKEN: ${{ secrets.FAKE_TOKEN_DO_NOT_USE }}

jobs:
  bundle-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: workspace
          path: .
  bundle-no-creds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
        with:
          persist-credentials: false
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: workspace-clean
          path: .
  bundle-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: dist
          path: dist/
  bundle-quoted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
        with:
          persist-credentials: "false"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: workspace-quoted
          path: ${{ github.workspace }}
  bundle-glob:
    runs-on: ubuntu-latest
    env:
      JOB_TOKEN: ${{ secrets.FAKE_JOB_TOKEN_DO_NOT_USE }}
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: everything
          path: '**'
