name: Shared step defaults
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - &setup
        name: Setup toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - <<: *setup
        name: Setup toolchain again
      - run: make build
