name: Trusted PR tests
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
jobs:
  test:
    if: contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3f1c0a9e7b2d4c6f8a1e5b9d0c7f2a4e6b8d1c3f
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: make test
