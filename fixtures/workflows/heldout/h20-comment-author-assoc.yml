name: Maintainer benchmark command
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  bench:
    if: github.event.issue.pull_request && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3f1c0a9e7b2d4c6f8a1e5b9d0c7f2a4e6b8d1c3f
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
      - run: make bench
